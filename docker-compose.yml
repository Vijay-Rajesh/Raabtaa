# By default this runs ONLY the API container, using a Neon (managed
# Postgres) database configured via DATABASE_URL in your .env file.
#
#   docker compose up --build
#
# If you'd rather run Postgres locally instead of using Neon, start the
# optional "local-db" profile and point DATABASE_URL at it:
#
#   docker compose --profile local-db up --build
#   # then set in .env:
#   # DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/Raabta

services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: Raabta
    ports:
      - "5432:5432"
    volumes:
      - Raabta_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  Raabta_pg_data:
